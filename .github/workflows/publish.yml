# Deliberately inert. No dispatch, credentials, write permissions, or publication commands.
# A future public release requires a separately reviewed authorization and configuration.
name: Public publication disabled
on:
  push:
    branches: [publication-disabled]
permissions: {}
jobs:
  publication-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Public publication is disabled for FromStan/POKIE'

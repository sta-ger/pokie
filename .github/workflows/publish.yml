name: Publish

on:
  workflow_dispatch:
    inputs:
      pc20_release_config:
        description: "Absolute path to the authorized PC-20 release config on the release runner"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Publishing is intentionally not an automatic push side effect.  The
      # authorized release runner must supply external merge/push/npm/Drive
      # receipts; the controller runs the one local composite gate and fails
      # closed on any identity, cleanup, or receipt mismatch.
      - name: Validate PC-20 release completion
        run: npm run release:pc20 -- --config "${{ inputs.pc20_release_config }}"
